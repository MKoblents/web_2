# 1. Базовые настройки сервера
ServerRoot "/usr/local/apache2"
Listen 80

# 2. Загрузка необходимых модулей Apache
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
User daemon
Group daemon
# Эти два модуля критически важны для проксирования запросов к Java:
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

# 3. Корневая папка для раздачи статических файлов (совпадает с volumes в docker-compose)
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# 4. Файл, который отдается по умолчанию при заходе на корень сайта
DirectoryIndex index.html

# 5. Настройка проксирования FastCGI запросов
# Все запросы, начинающиеся с /fcgi-bin/, будут перенаправлены на контейнер 'fastcgi-server' на порт 9000
# Протокол 'fcgi://' указывает Apache использовать именно FastCGI, а не обычный HTTP
ProxyPass /fcgi-bin/ fcgi://fastcgi-server:9000/
ProxyPassReverse /fcgi-bin/ fcgi://fastcgi-server:9000/

# 6. Настройка логирования (вывод в стандартные потоки Docker для удобства просмотра через docker logs)
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined