<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB_1 | Кобленц М.А. | P3206</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-header">
    <h1>Лабораторная работа №1</h1>
    <div class="student-info">
        <p>ФИО: <span class="student-name">Кобленц Мария Алексеевна</span></p>
        <p>Группа: <span class="group-number">P3206</span></p>
        <p>Вариант: <span class="variant-number">501832</span></p>
    </div>
</header>

<main class="container">
    <section class="canvas-section">
        <h2>График области</h2>
        <canvas id="coordinate-plane" width="1200" height="1200"></canvas>
    </section>

    <section class="form-section">
        <h2>Ввод координат</h2>
        <form id="point-form" class="point-form" novalidate>
            <div class="form-group">
                <label class="group-label">Координата X:</label>
                <div class="radio-group">
                    <input type="radio" id="x-minus-4" name="x" value="-4" class="radio-input">
                    <label for="x-minus-4" class="radio-label">-4</label>

                    <input type="radio" id="x-minus-3" name="x" value="-3" class="radio-input">
                    <label for="x-minus-3" class="radio-label">-3</label>

                    <input type="radio" id="x-minus-2" name="x" value="-2" class="radio-input">
                    <label for="x-minus-2" class="radio-label">-2</label>

                    <input type="radio" id="x-minus-1" name="x" value="-1" class="radio-input">
                    <label for="x-minus-1" class="radio-label">-1</label>

                    <input type="radio" id="x-zero" name="x" value="0" class="radio-input">
                    <label for="x-zero" class="radio-label">0</label>

                    <input type="radio" id="x-1" name="x" value="1" class="radio-input">
                    <label for="x-1" class="radio-label">1</label>

                    <input type="radio" id="x-2" name="x" value="2" class="radio-input">
                    <label for="x-2" class="radio-label">2</label>

                    <input type="radio" id="x-3" name="x" value="3" class="radio-input">
                    <label for="x-3" class="radio-label">3</label>

                    <input type="radio" id="x-4" name="x" value="4" class="radio-input">
                    <label for="x-4" class="radio-label">4</label>
                </div>
                <span class="error-message" id="x-error"></span>
            </div>

            <div class="form-group">
                <label for="y-input" class="group-label">Координата Y:</label>
                <input type="text" id="y-input" name="y" class="text-input" placeholder="От -3 до 3" pattern="^-?[0-9]+([.,][0-9]+)?$">
                <span class="error-message" id="y-error"></span>
            </div>

            <div class="form-group">
                <label class="group-label">Радиус R:</label>
                <div class="radio-group">
                    <input type="radio" id="r-1" name="r" value="1" class="radio-input">
                    <label for="r-1" class="radio-label">1</label>

                    <input type="radio" id="r-1.5" name="r" value="1.5" class="radio-input">
                    <label for="r-1.5" class="radio-label">1.5</label>

                    <input type="radio" id="r-2" name="r" value="2" class="radio-input">
                    <label for="r-2" class="radio-label">2</label>

                    <input type="radio" id="r-2.5" name="r" value="2.5" class="radio-input">
                    <label for="r-2.5" class="radio-label">2.5</label>

                    <input type="radio" id="r-3" name="r" value="3" class="radio-input">
                    <label for="r-3" class="radio-label">3</label>
                </div>
                <span class="error-message" id="r-error"></span>
            </div>

            <button type="submit" class="submit-btn">Проверить точку</button>
        </form>
    </section>

    <section class="results-section">
        <div class="results-header">
            <h2>Результаты</h2>
            <button type="button" id="clear-btn" class="clear-btn">Очистить результаты</button>
        </div>
        <div class="table-wrapper">
            <table class="results-table">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время</th>
                    <th>Время работы</th>
                </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
