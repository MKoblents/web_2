<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB_1 | Кобленц М.А. | P3206</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-header">
    <h1>Лабораторная работа №1</h1>
    <div class="student-info">
        <p>ФИО: <span class="student-name">Кобленц Мария Алексеевна</span></p>
        <p>Группа: <span class="group-number">P3206</span></p>
        <p>Вариант: <span class="variant-number">501832</span></p>
    </div>
</header>

<main class="container">
    <section class="canvas-section">
        <h2>График области</h2>
        <canvas id="coordinate-plane" width="1200" height="1200"></canvas>
    </section>

    <section class="form-section">
        <h2>Ввод координат</h2>
        <form id="point-form" class="point-form" novalidate>
            <div class="form-group">
                <label>Координата X:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="-4">
                        <span>-4</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="-3" required>
                        <span>-3</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="-2">
                        <span>-2</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="-1">
                        <span>-1</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="0">
                        <span>0</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="1">
                        <span>1</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="2">
                        <span>2</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="3">
                        <span>3</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="x" value="4">
                        <span>4</span>
                    </label>
                </div>
                <span class="error-message" id="x-error"></span>
            </div>
            <div class="form-group">
                <label for="y-input">Координата Y:</label>
                <input type="text" id="y-input" name="y" required placeholder="От -3 до 5" pattern="^-?[0-9]+([.,][0-9]+)?$">
                <span class="error-message" id="y-error"></span>
            </div>
            <div class="form-group">
                <label>Радиус R:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="r" value="1" required>
                        <span>1</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="r" value="1.5">
                        <span>1.5</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="r" value="2">
                        <span>2</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="r" value="2.5">
                        <span>2.5</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="r" value="3">
                        <span>3</span>
                    </label>
                </div>
                <span class="error-message" id="r-error"></span>
            </div>
            <button type="submit" class="submit-btn">Проверить точку</button>
        </form>
    </section>

    <section class="results-section">
        <div class="results-header">
            <h2>Результаты</h2>
            <button type="button" id="clear-btn" class="clear-btn">Очистить результаты</button>
        </div>
        <div class="table-wrapper">
            <table class="results-table">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время</th>
                    <th>Время работы</th>
                </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
